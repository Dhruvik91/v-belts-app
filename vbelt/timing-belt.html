<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing Belt Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="vendor/jspdf.plugin.autotable.min.js"></script>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="export.js"></script>
    <script src="db.js"></script>

    <style>
        .add-belt .btn { margin-top: 18px; }
        .card-tools { display: flex; align-items: center; gap: 8px; }

        .belt-search { margin-bottom: 18px; }

        /* Nested filters */
        .tabs-wrapper { display: flex; flex-direction: column; gap: 18px; }
        .tab-layer-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 8px;
        }
        .tab-layer-ctx { color: var(--text-4); font-weight: 400; margin-left: 4px; }
        .chip .icon-sm { width: 14px; height: 14px; }

        /* Summary bar — soft gray panel */
        .active-selection-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: var(--fill);
            border-radius: var(--r-card);
        }
        .breadcrumb-text { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .breadcrumb-text .sep { color: var(--text-4); font-weight: 400; }
        .selection-stats { display: flex; gap: 18px; font-size: 13px; color: var(--text-3); }
        .selection-stats b { color: var(--text); }

        /* Belt pieces */
        .belt-pieces-container { display: flex; flex-direction: column; gap: 2px; margin-top: -8px; }
        .belt-piece-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 12px 12px 14px;
            border-radius: var(--r-card);
            transition: background 0.15s var(--ease);
        }
        .belt-piece-card:hover { background: var(--hover); }
        .belt-info { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; min-width: 0; }
        .length-badge { font-size: 17px; font-weight: 600; min-width: 84px; letter-spacing: -0.02em; }
        .length-badge span { font-size: 12px; color: var(--text-3); font-weight: 500; }
        .belt-timestamps { font-size: 11px; color: var(--text-4); line-height: 1.5; }
        .piece-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

        /* Cut modal */
        .cut-details {
            background: var(--fill);
            border-radius: var(--r-card);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }
        .cut-detail-row { display: flex; justify-content: space-between; gap: 12px; }
        .cut-detail-row > span:first-child { color: var(--text-3); }
        #cutCalculationPreview { font-size: 13px; color: var(--text-3); font-weight: 500; }
    </style>
</head>

<body data-page="timingBelt" data-title="Timing belts">

    <aside class="sidebar" id="sidebar"></aside>
    <script src="shell.js"></script>

    <main class="main">
    <div class="page">

        <div class="page-header">
            <div>
                <h1>Timing belts</h1>
                <p>Organize, cut, and track timing belts by type, size, and brand.</p>
            </div>
        </div>

        <!-- ADD TIMING BELT -->
        <section class="card add-belt">
            <div class="card-header">
                <div>
                    <div class="card-title">Add timing belt stock</div>
                    <div class="card-sub">Each piece gets its own serial number.</div>
                </div>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="beltType">Type</label>
                    <input id="beltType" placeholder="e.g. H, T, M, NX">
                </div>
                <div class="field">
                    <label for="beltSize">Size</label>
                    <input id="beltSize" placeholder="e.g. 320, 340, 420">
                </div>
                <div class="field">
                    <label for="beltBrand">Brand</label>
                    <input id="beltBrand" placeholder="e.g. Royal, Gold, Spen">
                </div>
                <div class="field">
                    <label for="beltLength">Width / length (mm)</label>
                    <input id="beltLength" type="number" placeholder="e.g. 500">
                </div>
                <div class="field">
                    <label for="beltQty">Quantity</label>
                    <input id="beltQty" type="number" placeholder="e.g. 5" value="1" min="1">
                </div>
            </div>

            <button class="btn btn-primary" onclick="addTimingBelt()"><script>document.write(icon('plus'))</script>Add timing belt</button>
        </section>

        <!-- STOCK -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">Stock</div>
                <div class="card-tools">
                    <span class="badge badge-mono" id="totalStockBadge"></span>
                    <button class="btn btn-secondary btn-sm" onclick="exportBelts('excel')" title="Download as Excel"><script>document.write(icon('sheet'))</script>Excel</button>
                    <button class="btn btn-secondary btn-sm" onclick="exportBelts('pdf')" title="Download as PDF"><script>document.write(icon('download'))</script>PDF</button>
                </div>
            </div>

            <label class="search wide belt-search">
                <script>document.write(icon('search'))</script>
                <input type="text" id="searchBelt" placeholder="Search by type, size, brand, length or serial (e.g. H 320 Royal 400)">
            </label>

            <div id="timingBeltApp"></div>
        </section>

    </div>
    </main>

    <!-- CUT MODAL -->
    <div class="modal-overlay" id="cutModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Cut timing belt</h3>
                <button class="icon-btn" title="Close" onclick="closeCutModal()"><script>document.write(icon('x'))</script></button>
            </div>

            <div class="modal-body">
                <div class="cut-details" id="cutModalDetails"></div>

                <div class="field">
                    <label for="modalCutLength">Length to cut (mm)</label>
                    <input id="modalCutLength" type="number" min="1" placeholder="Enter mm to cut off">
                </div>

                <div id="cutCalculationPreview"></div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCutModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmCut()"><script>document.write(icon('scissors'))</script>Apply cut</button>
            </div>
        </div>
    </div>

    <script>
        let timingBelts = [];

        // Active tab states
        let selectedType = null;
        let selectedSize = null;
        let selectedBrand = null;

        // Current belt being cut
        let activeBeltIdToCut = null;

        function debounce(fn, delay = 300) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        document.getElementById("searchBelt").addEventListener("input", debounce(renderTimingBelts));

        function formatSerial(n) {
            return `TB-${String(n).padStart(4, "0")}`;
        }

        function serialNumberOf(belt) {
            return parseInt(String(belt.serial || "").replace(/\D/g, ""), 10) || 0;
        }

        // Serials are never reused: the counter is kept in config and never goes below the highest serial in stock
        async function nextSerialNumber() {
            const last = await DB.getConfig("lastBeltSerial", 0);
            return Math.max(parseInt(last, 10) || 0, ...timingBelts.map(serialNumberOf)) + 1;
        }

        // Give older belts (saved before serials/updatedAt existed) a serial in the order they were added
        async function migrateBelts() {
            const missing = timingBelts.filter(b => !b.serial).sort((a, b) => a.id - b.id);
            const missingUpdated = timingBelts.filter(b => !b.updatedAt);
            if (!missing.length && !missingUpdated.length) return;

            let next = await nextSerialNumber();
            missing.forEach(b => { b.serial = formatSerial(next++); });
            missingUpdated.forEach(b => {
                b.updatedAt = (b.history && b.history[0] && b.history[0].date) || b.createdAt;
            });

            if (missing.length) await DB.saveConfig("lastBeltSerial", next - 1);
            await saveTimingBelts();
        }

        async function saveTimingBelts() {
            await DB.saveAll("timingBelts", timingBelts);
        }

        async function addTimingBelt() {
            const type = document.getElementById("beltType").value.trim().toUpperCase();
            const size = document.getElementById("beltSize").value.trim();
            const brand = document.getElementById("beltBrand").value.trim();
            const length = parseInt(document.getElementById("beltLength").value);
            const qty = parseInt(document.getElementById("beltQty").value);

            if (!type || !size || !brand || isNaN(length) || length <= 0 || isNaN(qty) || qty <= 0) {
                showToast("Please fill all fields with valid information.", "warning");
                return;
            }

            const firstSerial = await nextSerialNumber();
            const now = new Date().toLocaleString();

            for (let i = 0; i < qty; i++) {
                timingBelts.push({
                    id: Date.now() + i,
                    serial: formatSerial(firstSerial + i),
                    type,
                    size,
                    brand,
                    length,
                    originalLength: length,
                    createdAt: now,
                    updatedAt: now,
                    history: []
                });
            }

            await DB.saveConfig("lastBeltSerial", firstSerial + qty - 1);
            await saveTimingBelts();

            // Clear inputs
            document.getElementById("beltType").value = "";
            document.getElementById("beltSize").value = "";
            document.getElementById("beltBrand").value = "";
            document.getElementById("beltLength").value = "";
            document.getElementById("beltQty").value = "1";

            // Automatically focus into the newly added type, size, brand
            selectedType = type;
            selectedSize = size;
            selectedBrand = brand;

            renderTimingBelts();
            showToast(`Added ${qty} piece(s) of ${type} ${size} (${brand})`, "success");
        }

        // Search follows the tab hierarchy: Type -> Size -> Brand -> Length (mm).
        // A word that exactly names an existing type or size matches only that type/size,
        // so "H 320" shows type H, size 320 — not brands containing "h" or sizes like 1320.
        // Once a size is given, a later number is the piece length: "H 320 Royal 400" finds
        // the 400 mm piece. A number that isn't a known size is also treated as a length.
        // Serial numbers (e.g. "TB-0012") match exactly; other words match the start of a size or brand.
        function getFilteredBelts() {
            const terms = document.getElementById("searchBelt").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
            if (!terms.length) return timingBelts;

            const lower = v => String(v).toLowerCase();
            const knownTypes = new Set(timingBelts.map(b => lower(b.type)));
            const knownSizes = new Set(timingBelts.map(b => lower(b.size)));

            let sizeGiven = false;
            const matchers = terms.map(t => {
                const num = t.replace(/mm$/, "");
                const isNumber = /^\d+$/.test(num);

                if (/^tb-?\d+$/.test(t)) {
                    const serialNo = parseInt(t.replace(/\D/g, ""), 10);
                    return belt => parseInt(String(belt.serial || "").replace(/\D/g, ""), 10) === serialNo;
                }
                if (knownTypes.has(t)) return belt => lower(belt.type) === t;
                if (isNumber && (sizeGiven || !knownSizes.has(num))) {
                    return belt => belt.length === parseInt(num, 10);
                }
                if (knownSizes.has(t)) {
                    sizeGiven = true;
                    return belt => lower(belt.size) === t;
                }
                return belt => lower(belt.size).startsWith(t) || lower(belt.brand).startsWith(t);
            });

            return timingBelts.filter(belt => matchers.every(match => match(belt)));
        }

        function buildDataTree(belts) {
            const tree = {};
            belts.forEach(belt => {
                if (!tree[belt.type]) tree[belt.type] = {};
                if (!tree[belt.type][belt.size]) tree[belt.type][belt.size] = {};
                if (!tree[belt.type][belt.size][belt.brand]) tree[belt.type][belt.size][belt.brand] = [];

                tree[belt.type][belt.size][belt.brand].push(belt);
            });
            return tree;
        }

        function renderTimingBelts() {
            const container = document.getElementById("timingBeltApp");
            const totalStockBadge = document.getElementById("totalStockBadge");
            
            totalStockBadge.innerText = `${timingBelts.length} piece${timingBelts.length === 1 ? '' : 's'}`;

            if (timingBelts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        ${icon('belt')}
                        <h4>No timing belts in stock</h4>
                        <p>Add your timing belt stock using the form above to view by Type, Size, and Brand tabs.</p>
                    </div>
                `;
                return;
            }

            const filteredBelts = getFilteredBelts();
            if (filteredBelts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        ${icon('search')}
                        <h4>No matching timing belts</h4>
                        <p>No belts match your search. Try a different type, size, brand or length.</p>
                    </div>
                `;
                return;
            }

            const tree = buildDataTree(filteredBelts);
            const types = Object.keys(tree).sort();

            // Ensure selectedType is valid
            if (!selectedType || !tree[selectedType]) {
                selectedType = types[0];
            }

            // Ensure selectedSize is valid
            const sizes = Object.keys(tree[selectedType] || {}).sort();
            if (!selectedSize || !tree[selectedType]?.[selectedSize]) {
                selectedSize = sizes[0] || null;
            }

            // Ensure selectedBrand is valid
            const brands = selectedSize ? Object.keys(tree[selectedType]?.[selectedSize] || {}).sort() : [];
            if (!selectedBrand || !tree[selectedType]?.[selectedSize]?.[selectedBrand]) {
                selectedBrand = brands[0] || null;
            }

            // Construct nested filters: Type (segmented) → Size (chips) → Brand (chips)
            let html = `<div class="tabs-wrapper">`;

            // LAYER 1: TYPE
            html += `
                <div class="tab-layer">
                    <div class="tab-layer-label">Type</div>
                    <div class="segmented">
            `;
            types.forEach(t => {
                const isActive = t === selectedType;
                let count = 0;
                Object.values(tree[t]).forEach(sizesObj => {
                    Object.values(sizesObj).forEach(pieces => {
                        count += pieces.length;
                    });
                });

                html += `
                    <button class="${isActive ? 'active' : ''}" onclick="selectType('${t}')">
                        <span>${t}</span>
                        <span class="count">${count}</span>
                    </button>
                `;
            });
            html += `</div></div>`;

            // LAYER 2: SIZE
            if (sizes.length > 0) {
                html += `
                    <div class="tab-layer">
                        <div class="tab-layer-label">Size <span class="tab-layer-ctx">in ${selectedType}</span></div>
                        <div class="chip-row">
                `;
                sizes.forEach(s => {
                    const isActive = s === selectedSize;
                    let sizeCount = 0;
                    Object.values(tree[selectedType][s]).forEach(pieces => {
                        sizeCount += pieces.length;
                    });

                    html += `
                        <button class="chip ${isActive ? 'active' : ''}" onclick="selectSize('${s}')">
                            <span class="mono">${s}</span>
                            <span class="count">${sizeCount}</span>
                        </button>
                    `;
                });
                html += `</div></div>`;
            }

            // LAYER 3: BRAND
            if (brands.length > 0) {
                html += `
                    <div class="tab-layer">
                        <div class="tab-layer-label">Brand <span class="tab-layer-ctx">in ${selectedType} · ${selectedSize}</span></div>
                        <div class="chip-row">
                `;
                brands.forEach(b => {
                    const isActive = b === selectedBrand;
                    const brandPieces = tree[selectedType][selectedSize][b] || [];

                    html += `
                        <button class="chip ${isActive ? 'active' : ''}" onclick="selectBrand('${b}')">
                            ${icon('tag', 'icon-sm')}
                            <span>${b}</span>
                            <span class="count">${brandPieces.length}</span>
                        </button>
                    `;
                });
                html += `</div></div>`;
            }

            // SUMMARY BAR
            const pieces = (selectedType && selectedSize && selectedBrand)
                ? (tree[selectedType]?.[selectedSize]?.[selectedBrand] || [])
                : [];

            const totalMm = pieces.reduce((acc, p) => acc + p.length, 0);

            html += `
                <div class="active-selection-bar">
                    <div class="breadcrumb-text">
                        <span>${selectedType || '-'}</span>
                        <span class="sep">/</span>
                        <span class="mono">${selectedSize || '-'}</span>
                        <span class="sep">/</span>
                        <span>${selectedBrand || '-'}</span>
                    </div>
                    <div class="selection-stats">
                        <span><b class="mono">${pieces.length}</b> piece${pieces.length === 1 ? '' : 's'}</span>
                        <span>Total <b class="mono">${totalMm} mm</b></span>
                    </div>
                </div>
            `;

            // BELT PIECES LIST (CUT / DELETE)
            html += `<div class="belt-pieces-container">`;

            if (pieces.length === 0) {
                html += `
                    <div class="empty-state">
                        <p>No pieces currently in stock for this combination.</p>
                    </div>
                `;
            } else {
                // Largest remaining length first
                const sortedPieces = [...pieces].sort((a, b) => b.length - a.length);

                sortedPieces.forEach(belt => {
                    const isCut = belt.length < belt.originalLength;
                    html += `
                        <div class="belt-piece-card">
                            <div class="belt-info">
                                <span class="code-chip">${belt.serial || '-'}</span>
                                <div class="length-badge mono">${belt.length} <span>mm</span></div>
                                <span class="badge badge-mono">Original ${belt.originalLength} mm</span>
                                ${isCut
                                    ? `<span class="badge badge-warning">${icon('scissors')}Cut piece</span>`
                                    : `<span class="badge badge-success">${icon('check')}Full roll</span>`}
                                <div class="belt-timestamps mono">
                                    <div>Created ${belt.createdAt || '-'}</div>
                                    <div>Updated ${belt.updatedAt || belt.createdAt || '-'}</div>
                                </div>
                            </div>
                            <div class="piece-actions">
                                <button class="btn btn-secondary btn-sm" onclick="openCutModal(${belt.id})">${icon('scissors')}Cut</button>
                                <button class="icon-btn danger" title="Delete" onclick="deleteBelt(${belt.id})">${icon('trash')}</button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`; // end pieces container
            html += `</div>`; // end tabs-wrapper

            container.innerHTML = html;
        }

        // Tab selection event handlers
        /* EXPORT (Excel / PDF) — exports what the current search shows */
        function exportBelts(kind) {
            // One row per Type + Size + Brand; every piece's length is listed in that row,
            // largest first, with repeats collapsed (e.g. "500 ×3, 400, 350").
            const groups = new Map();
            getFilteredBelts().forEach(b => {
                const key = [b.type, b.size, b.brand].map(v => String(v).trim().toLowerCase()).join("|");
                if (!groups.has(key)) groups.set(key, { type: b.type, size: b.size, brand: b.brand, lengths: [] });
                groups.get(key).lengths.push(Number(b.length) || 0);
            });

            const list = [...groups.values()].sort((a, b) =>
                String(a.type).localeCompare(String(b.type)) ||
                String(a.size).localeCompare(String(b.size), undefined, { numeric: true }) ||
                String(a.brand).localeCompare(String(b.brand))
            );

            const formatLengths = lengths => {
                const counts = new Map();
                [...lengths].sort((x, y) => y - x).forEach(l => counts.set(l, (counts.get(l) || 0) + 1));
                return [...counts].map(([l, n]) => n > 1 ? `${l} ×${n}` : `${l}`).join(", ");
            };

            const columns = [
                { header: "TYPE", type: "text", width: 12 },
                { header: "SIZE", type: "text", width: 12 },
                { header: "BRAND", type: "text", width: 20 },
                { header: "LENGTH (MM)", type: "text", width: 36 }
            ];

            const rows = list.map(g => [g.type, g.size, g.brand, formatLengths(g.lengths)]);

            const pieces = list.reduce((sum, g) => sum + g.lengths.length, 0);
            const search = document.getElementById("searchBelt").value.trim();
            const subtitle = `${pieces} piece${pieces === 1 ? "" : "s"}` +
                (search ? ` · filtered by "${search}"` : "");

            if (kind === "excel") {
                Exporter.excel({ sheetName: "Timing Belts", columns, rows, filename: "timing-belts" });
            } else {
                Exporter.pdf({ title: "Timing Belt Stock", subtitle, columns, rows, filename: "timing-belts" });
            }
        }

        function selectType(type) {
            selectedType = type;
            selectedSize = null;
            selectedBrand = null;
            renderTimingBelts();
        }

        function selectSize(size) {
            selectedSize = size;
            selectedBrand = null;
            renderTimingBelts();
        }

        function selectBrand(brand) {
            selectedBrand = brand;
            renderTimingBelts();
        }

        // Modal Cutting Handlers
        function openCutModal(id) {
            const belt = timingBelts.find(b => b.id === id);
            if (!belt) return;

            activeBeltIdToCut = id;
            const modal = document.getElementById("cutModal");
            const details = document.getElementById("cutModalDetails");
            const input = document.getElementById("modalCutLength");
            const preview = document.getElementById("cutCalculationPreview");

            details.innerHTML = `
                <div class="cut-detail-row"><span>Belt</span><b>${belt.serial ? `<span class="mono">${belt.serial}</span> · ` : ''}${belt.type} · <span class="mono">${belt.size}</span> · ${belt.brand}</b></div>
                <div class="cut-detail-row"><span>Current length</span><b class="mono">${belt.length} mm</b></div>
                <div class="cut-detail-row"><span>Original length</span><span class="mono">${belt.originalLength} mm</span></div>
            `;

            input.value = "";
            input.max = belt.length - 1;
            preview.innerText = `Enter cut length less than ${belt.length} mm`;

            input.oninput = () => {
                const cutVal = parseInt(input.value);
                if (isNaN(cutVal) || cutVal <= 0) {
                    preview.innerText = `Enter mm to cut`;
                    preview.style.color = "var(--text-3)";
                } else if (cutVal >= belt.length) {
                    preview.innerText = `Cut length cannot be equal or greater than current length (${belt.length} mm)`;
                    preview.style.color = "var(--danger-hard)";
                } else {
                    const remaining = belt.length - cutVal;
                    preview.innerText = `Remaining after cut: ${remaining} mm`;
                    preview.style.color = "var(--success)";
                }
            };

            modal.classList.add("open");
            setTimeout(() => input.focus(), 100);
        }

        function closeCutModal() {
            const modal = document.getElementById("cutModal");
            modal.classList.remove("open");
            activeBeltIdToCut = null;
        }


        async function confirmCut() {
            if (!activeBeltIdToCut) return;

            const belt = timingBelts.find(b => b.id === activeBeltIdToCut);
            if (!belt) return;

            const input = document.getElementById("modalCutLength");
            const cutLength = parseInt(input.value);

            if (isNaN(cutLength) || cutLength <= 0) {
                showToast("Please enter a valid cut length.", "warning");
                return;
            }

            if (cutLength >= belt.length) {
                showToast(`Cut length must be less than current length (${belt.length} mm).`, "warning");
                return;
            }

            const before = belt.length;
            belt.length = belt.length - cutLength;

            const now = new Date().toLocaleString();
            belt.updatedAt = now;

            if (!belt.history) belt.history = [];
            belt.history.unshift({
                cut: cutLength,
                before,
                after: belt.length,
                date: now
            });

            await saveTimingBelts();
            closeCutModal();
            renderTimingBelts();
            showToast(`Cut applied successfully. Remaining: ${belt.length} mm`, "success");
        }

        async function deleteBelt(id) {
            const belt = timingBelts.find(b => b.id === id);
            if (!belt) return;

            const ok = await showConfirm(`Are you sure you want to permanently delete ${belt.serial || 'this piece'} — ${belt.type} ${belt.size} (${belt.length}mm)?`, {
                title: "Delete Belt Piece",
                confirmText: "Delete",
                isDanger: true
            });
            if (!ok) return;

            timingBelts = timingBelts.filter(b => b.id !== id);
            await saveTimingBelts();
            renderTimingBelts();
            showToast("Timing belt piece deleted", "info");
        }

        /* Keyboard shortcuts */
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeCutModal();
                return;
            }

        }, true);

        // Initial Data Load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await DB.init();
                timingBelts = await DB.getAll("timingBelts") || [];
                await migrateBelts();
                renderTimingBelts();
            } catch (e) {
                console.error("Failed to initialize timing belts:", e);
            }
        });
    </script>

</body>

</html>
