<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="db.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f1f5f9
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background: #0f172a;
            color: white;
            position: fixed;
            padding: 20px
        }

        .sidebar h2 {
            text-align: center
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.33px
        }

        .sidebar button:hover {
            background: #334155
        }

        .main {
            margin-left: 240px;
            padding: 30px
        }

        /* Print only the purchase order */
        @media print {
            .sidebar,
            .action-bar {
                display: none
            }

            .main {
                margin-left: 0;
                padding: 0
            }

            .card {
                box-shadow: none
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .06)
        }

        h2 {
            text-align: center
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px
        }

        th {
            background: #e0e7ff
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 14px;
        }

        .print-btn {
            background: #16a34a;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Inventory</h2>
        <button onclick="location.href='index.html'">Dashboard</button>
        <button onclick="location.href='products.html'">Inventory</button>
        <button onclick="location.href='products.html#bulkSub'">Bulk Subtract</button>
        <button onclick="location.href='products.html#bulkAdd'">Bulk Add</button>
        <button onclick="location.href='party.html'">Party List</button>
        <button onclick="location.href='low-stock.html'">Low Stock Items</button>
        <button onclick="location.href='timing-belt.html'">Timing Belt</button>
    </div>

    <div class="main">

        <div class="card">
            <div class="top-bar">
                <div>
                    <div class="company-title">PATEL V BELT CORPORATION</div>
                    <div class="po-info">
                        Date: <span id="poDate"></span>
                    </div>
                </div>

                <div class="action-bar">
                    <button class="print-btn" onclick="window.print()">🖨 Print / Save PDF</button>
                </div>
            </div>


            <h2>Purchase Order</h2>

            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Current Stock</th>
                        <th>Order Qty</th>

                    </tr>
                </thead>
                <tbody id="poList"></tbody>
            </table>

        </div>

    </div>

    <script>
        let products = [];

        function generatePO() {

            const d = new Date();
            const poDate = document.getElementById("poDate");
            if (poDate) {
                poDate.textContent =
                    String(d.getDate()).padStart(2, "0") + "-" +
                    String(d.getMonth() + 1).padStart(2, "0") + "-" +
                    d.getFullYear();
            }

            const tbody = document.getElementById("poList");
            if (!tbody) return;
            tbody.innerHTML = "";

            const lowItems = products.filter(p => p.qty <= p.minQty);

            if (!lowItems.length) {
                tbody.innerHTML = `<tr><td colspan="5">No Low Stock Items</td></tr>`;
                return;
            }

            lowItems.forEach(p => {

                const orderQty = p.minQty - p.qty;

                const tr = document.createElement("tr");
                tr.innerHTML = `
            <tr>
            <td>${p.name}</td>
            <td>${p.qty}</td>
            <td><b>${orderQty}</b></td>
            </tr>

        `;
                tbody.appendChild(tr);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await DB.init();
                products = await DB.getAll("products");
                generatePO();
            } catch (e) {
                console.error("Failed to initialize database:", e);
            }
        });
    </script>

</body>

</html>
