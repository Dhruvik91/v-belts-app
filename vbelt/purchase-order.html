<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="db.js"></script>

    <style>
        .po-doc { padding: 28px 32px; }
        .po-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .company-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
        .po-title { font-size: 13px; color: var(--text-3); margin-top: 4px; }
        .po-info { text-align: right; }
        .po-info .eyebrow { display: block; margin-bottom: 4px; }
        .po-info .mono { font-size: 14px; }

        @media print {
            body { background: #FFFFFF; }
            .po-doc { padding: 0; }
            .table-wrap { border-color: #D9D9D9; }
        }
    </style>
</head>

<body data-page="purchaseOrder" data-title="Purchase order">

    <aside class="sidebar" id="sidebar"></aside>
    <script src="shell.js"></script>

    <main class="main">
    <div class="page-narrow page">

        <div class="page-header no-print">
            <div>
                <h1>Purchase order</h1>
                <p>Order quantities to bring every low-stock item back to its minimum.</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" onclick="window.print()"><script>document.write(icon('printer'))</script>Print / Save PDF</button>
            </div>
        </div>

        <section class="card po-doc">
            <div class="po-head">
                <div>
                    <div class="company-title">PATEL V BELT CORPORATION</div>
                    <div class="po-title">Purchase Order</div>
                </div>
                <div class="po-info">
                    <span class="eyebrow">Date</span>
                    <span class="mono" id="poDate"></span>
                </div>
            </div>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th class="num">Current stock</th>
                            <th class="num">Order qty</th>
                        </tr>
                    </thead>
                    <tbody id="poList"></tbody>
                </table>
            </div>
        </section>

    </div>
    </main>

    <script>
        let products = [];

        function generatePO() {

            const d = new Date();
            const poDate = document.getElementById("poDate");
            if (poDate) {
                poDate.textContent =
                    String(d.getDate()).padStart(2, "0") + "-" +
                    String(d.getMonth() + 1).padStart(2, "0") + "-" +
                    d.getFullYear();
            }

            const tbody = document.getElementById("poList");
            if (!tbody) return;
            tbody.innerHTML = "";

            const lowItems = products.filter(p => p.qty <= p.minQty);

            if (!lowItems.length) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty">No low stock items — nothing to order.</td></tr>`;
                return;
            }

            lowItems.forEach(p => {

                const orderQty = p.minQty - p.qty;

                const tr = document.createElement("tr");
                tr.innerHTML = `
            <td>${p.name}</td>
            <td class="num">${p.qty}</td>
            <td class="num"><b>${orderQty}</b></td>
        `;
                tbody.appendChild(tr);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await DB.init();
                products = await DB.getAll("products");
                generatePO();
            } catch (e) {
                console.error("Failed to initialize database:", e);
            }
        });
    </script>

</body>

</html>
