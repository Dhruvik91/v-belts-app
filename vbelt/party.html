<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="vendor/jspdf.plugin.autotable.min.js"></script>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="export.js"></script>
    <script src="db.js"></script>
</head>

<body data-page="party" data-title="Party list">

    <aside class="sidebar" id="sidebar"></aside>
    <script src="shell.js"></script>

    <main class="main">
    <div class="page">

        <div class="page-header">
            <div>
                <h1>Party list</h1>
                <p>Suppliers and customers used for bulk stock movements.</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" onclick="exportParties('excel')" title="Download as Excel"><script>document.write(icon('sheet'))</script>Excel</button>
                <button class="btn btn-secondary" onclick="exportParties('pdf')" title="Download as PDF"><script>document.write(icon('download'))</script>PDF</button>
                <a class="btn btn-primary" href="index.html#addParty"><script>document.write(icon('plus'))</script>Add party</a>
            </div>
        </div>

        <section class="card">
            <div class="card-header">
                <label class="search">
                    <script>document.write(icon('search'))</script>
                    <input id="search" placeholder="Search by code, name or notes">
                </label>
                <span class="badge badge-mono" id="partyCountBadge">0 parties</span>
            </div>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Notes / discount</th>
                            <th class="actions"></th>
                        </tr>
                    </thead>
                    <tbody id="partyList"></tbody>
                </table>
            </div>
        </section>

    </div>
    </main>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit party</h3>
                <button class="icon-btn" title="Close" onclick="closeEdit()"><script>document.write(icon('x'))</script></button>
            </div>

            <div class="modal-body">
                <div class="field">
                    <label for="editCode">Party code</label>
                    <input id="editCode" placeholder="Party code" readonly>
                </div>

                <div class="field">
                    <label for="editName">Party name</label>
                    <input id="editName" placeholder="Enter party name">
                </div>

                <div class="field">
                    <label for="editNotes">Notes / terms</label>
                    <textarea id="editNotes" rows="3" placeholder="e.g. 5% discount, credit 15 days"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEdit()">Save changes</button>
            </div>
        </div>
    </div>

    <script>
        let parties = [];
        let editIndex = null;

        /* EXPORT (Excel / PDF) — exports what the current search shows */
        function exportParties(kind) {
            const q = document.getElementById("search").value.trim().toLowerCase();
            const list = parties
                .filter(p =>
                    p.code.toLowerCase().includes(q) ||
                    p.name.toLowerCase().includes(q) ||
                    (p.notes || "").toLowerCase().includes(q)
                )
                .sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));

            const columns = [
                { header: "Code", type: "text", width: 10 },
                { header: "Name", type: "text" },
                { header: "Notes / Discount", type: "text" }
            ];
            const rows = list.map(p => [p.code, p.name, p.notes || ""]);
            const subtitle = `${rows.length} part${rows.length === 1 ? "y" : "ies"}` + (q ? ` · filtered by "${q}"` : "");

            if (kind === "excel") {
                Exporter.excel({ sheetName: "Parties", columns, rows, filename: "party-list" });
            } else {
                Exporter.pdf({ title: "Party List", subtitle, columns, rows, filename: "party-list" });
            }
        }

        function renderPartyList() {
            const q = document.getElementById("search").value.trim().toLowerCase();
            const partyList = document.getElementById("partyList");
            partyList.innerHTML = "";
            document.getElementById("partyCountBadge").textContent = `${parties.length} part${parties.length === 1 ? 'y' : 'ies'}`;

            // Keep the original index so Edit/Delete target the right party while filtered
            const matches = parties
                .map((p, i) => ({ p, i }))
                .filter(({ p }) =>
                    p.code.toLowerCase().includes(q) ||
                    p.name.toLowerCase().includes(q) ||
                    (p.notes || "").toLowerCase().includes(q)
                );

            if (!matches.length) {
                partyList.innerHTML = `<tr><td colspan="4" class="empty">No parties found</td></tr>`;
                return;
            }

            matches
                .forEach(({ p, i }) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
            <td><span class="code-chip">${p.code}</span></td>
            <td><b>${p.name}</b></td>
            <td class="muted">${p.notes || "—"}</td>
            <td class="actions">
                <button class="icon-btn" title="Edit" onclick="openEdit(${i})">${icon('edit')}</button>
                <button class="icon-btn danger" title="Delete" onclick="deleteParty(${i})">${icon('trash')}</button>
            </td>
        `;
                    partyList.appendChild(tr);
                });
        }

        function debounce(fn, delay = 300) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        document.getElementById("search").addEventListener("input", debounce(renderPartyList));

        function openEdit(index) {
            editIndex = index;
            document.getElementById("editCode").value = parties[index].code;
            document.getElementById("editName").value = parties[index].name;
            document.getElementById("editNotes").value = parties[index].notes || "";
            const modal = document.getElementById("editModal");
            modal.classList.add("open");
            modal.style.display = "flex";
            setTimeout(() => document.getElementById("editName").focus(), 80);
        }

        function closeEdit() {
            const modal = document.getElementById("editModal");
            modal.classList.remove("open");
            modal.style.display = "none";
            editIndex = null;
        }

        async function saveEdit() {
            const name = document.getElementById("editName").value.trim();
            const notes = document.getElementById("editNotes").value.trim();

            if (!name) {
                showToast("Please enter a party name", "warning");
                return;
            }

            parties[editIndex].name = name;
            parties[editIndex].notes = notes;

            await DB.saveAll("parties", parties);

            closeEdit();
            renderPartyList();
            showToast(`Party "${name}" updated successfully`, "success");
        }

        async function deleteParty(i) {
            const party = parties[i];
            const name = party ? party.name : "this party";

            const ok = await showConfirm(`Are you sure you want to permanently delete party "${name}"?`, {
                title: "Delete Party",
                confirmText: "Delete",
                isDanger: true
            });

            if (!ok) return;

            parties.splice(i, 1);
            await DB.saveAll("parties", parties);

            renderPartyList();
            showToast(`Party "${name}" deleted successfully`, "info");
        }

        // Close modal on backdrop click or Escape
        window.addEventListener("click", function (e) {
            const modal = document.getElementById("editModal");
            if (e.target === modal) closeEdit();
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") closeEdit();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await DB.init();
                parties = await DB.getAll("parties");
                renderPartyList();
            } catch (e) {
                console.error("Failed to initialize database:", e);
            }
        });


        renderPartyList();
    </script>

</body>

</html>
