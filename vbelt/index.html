<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">

<!-- PDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="db.js"></script>

<style>
.quick-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
.quick-row .btn-pill .icon { width: 16px; height: 16px; }
.form-card .btn { margin-top: 18px; }
</style>
</head>

<body data-page="dashboard" data-title="Dashboard">

<aside class="sidebar" id="sidebar"></aside>
<script src="shell.js"></script>

<main class="main">
<div class="page">

    <div class="page-header">
        <div>
            <h1>Dashboard</h1>
            <p>Overview of your V-belt and timing belt stock.</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportToPDF()"><script>document.write(icon('download'))</script>Export PDF</button>
        </div>
    </div>

    <!-- DASHBOARD STATS -->
    <div class="stat-grid">
        <a class="stat" href="products.html">
            <div class="stat-label"><script>document.write(icon('box', 'icon-sm'))</script>Total products</div>
            <div class="stat-value" id="totalProducts">0</div>
        </a>
        <a class="stat" href="low-stock.html">
            <div class="stat-label"><script>document.write(icon('alert', 'icon-sm'))</script>Low stock items</div>
            <div class="stat-value" id="lowStockCount">0</div>
        </a>
        <a class="stat" href="party.html">
            <div class="stat-label"><script>document.write(icon('users', 'icon-sm'))</script>Parties</div>
            <div class="stat-value" id="partyCount">0</div>
        </a>
        <a class="stat" href="timing-belt.html">
            <div class="stat-label"><script>document.write(icon('belt', 'icon-sm'))</script>Timing belt pieces</div>
            <div class="stat-value" id="beltCount">0</div>
        </a>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="quick-row">
        <a class="btn btn-pill" href="products.html#bulkAdd">Bulk add stock <script>document.write(icon('arrowIn'))</script></a>
        <a class="btn btn-pill" href="products.html#bulkSub">Bulk subtract stock <script>document.write(icon('arrowOut'))</script></a>
        <a class="btn btn-pill" href="purchase-order.html">Generate purchase order <script>document.write(icon('file'))</script></a>
    </div>

    <div class="grid-2">
        <!-- ADD PRODUCT -->
        <section class="card form-card" id="addProductCard">
            <div class="card-header">
                <div>
                    <div class="card-title">Add product</div>
                    <div class="card-sub">Create a new item in the inventory.</div>
                </div>
            </div>

            <div class="form-stack">
                <div class="field">
                    <label for="name">Product name</label>
                    <input id="name" placeholder="e.g. A-42">
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <input id="category" list="categoryList" placeholder="Select or type a category">
                    <datalist id="categoryList"></datalist>
                </div>
                <div class="form-grid">
                    <div class="field">
                        <label for="qty">Initial quantity</label>
                        <input id="qty" type="number" placeholder="0">
                    </div>
                    <div class="field">
                        <label for="minQty">Minimum quantity</label>
                        <input id="minQty" type="number" placeholder="0">
                    </div>
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="addProduct()">Add product</button>
        </section>

        <!-- ADD PARTY -->
        <section class="card form-card" id="addPartyCard">
            <div class="card-header">
                <div>
                    <div class="card-title">Add party</div>
                    <div class="card-sub">Suppliers and customers for stock movements.</div>
                </div>
            </div>

            <div class="form-stack">
                <div class="field">
                    <label for="partyName">Party name</label>
                    <input id="partyName" placeholder="e.g. Shree Traders">
                </div>
                <div class="field">
                    <label for="partyNotes">Notes / discount</label>
                    <input id="partyNotes" placeholder="e.g. 5% discount, credit 15 days">
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="addParty()">Add party</button>
        </section>
    </div>

</div>
</main>

<script>
let products = [];
let parties = [];

/* Update dashboard */
function updateDashboard() {
    document.getElementById("totalProducts").innerText = products.length;
    document.getElementById("partyCount").innerText = parties.length;

    const lowStock = products.filter(p => p.qty <= p.minQty);
    const lowEl = document.getElementById("lowStockCount");
    lowEl.innerText = lowStock.length;
    lowEl.classList.toggle("is-danger", lowStock.length > 0);
}

/* Add product */
async function addProduct() {
    const name = document.getElementById("name").value.trim();
    const cat = document.getElementById("category").value.trim();
    const qty = parseInt(document.getElementById("qty").value);
    const min = parseInt(document.getElementById("minQty").value);

    if (!name || !cat || isNaN(qty) || isNaN(min)) {
        showToast("Please fill all fields with valid information", "warning");
        return;
    }

    // Duplicate product name check
    products = await DB.getAll("products");
    const exists = products.some(
        p => p.name.toLowerCase() === name.toLowerCase()
    );

    if (exists) {
        showToast(`Product "${name}" already exists in inventory`, "error");
        document.getElementById("name").focus();
        return;
    }

    const product = {
        id: Date.now(),
        name,
        category: cat,
        qty,
        minQty: min,
        lastUpdated: new Date().toLocaleString(),
        history: []
    };

    // Low stock tracking
    if (qty <= min) {
        product.lowStockDate = new Date().toISOString();
    }

    products.push(product);
    await DB.saveAll("products", products);

    showToast(`Product "${name}" added successfully!`, "success");

    document.getElementById("name").value = "";
    document.getElementById("category").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("minQty").value = "";

    document.getElementById("name").focus();

    await loadCategories();
    updateDashboard();
}

async function loadCategories() {
    products = await DB.getAll("products");
    const list = document.getElementById("categoryList");

    if (!list) return;

    list.innerHTML = "";

    const categories = [...new Set(products.map(p => p.category))];

    categories.forEach(cat => {
        if (!cat) return;
        const opt = document.createElement("option");
        opt.value = cat;
        list.appendChild(opt);
    });
}

function generatePartyCode() {
    if (parties.length === 0) return "P001";

    const nums = parties.map(p => parseInt(p.code.replace("P","")) || 0);
    const max = Math.max(...nums);

    return "P" + String(max + 1).padStart(3, "0");
}

/* ADD PARTY */
async function addParty() {
    const name = document.getElementById("partyName").value.trim();
    const notes = document.getElementById("partyNotes").value.trim();

    if (!name) {
        showToast("Please enter Party Name", "warning");
        return;
    }

    parties = await DB.getAll("parties");
    const code = generatePartyCode();

    parties.push({
        id: Date.now(),
        code,
        name,
        notes
    });

    await DB.saveAll("parties", parties);

    showToast(`Party "${name}" added successfully! (Code: ${code})`, "success");

    document.getElementById("partyName").value = "";
    document.getElementById("partyNotes").value = "";
    updateDashboard();
}

/* EXPORT TO PDF (CATEGORY SORTED) */
function exportToPDF() {
    if (products.length === 0) {
        showToast("No inventory data available to export", "warning");
        return;
    }

    const sorted = [...products].sort((a, b) =>
        a.category.localeCompare(b.category)
    );

    const rows = sorted.map(p => [
        p.category,
        p.name,
        p.qty,
        p.minQty,
        p.lastUpdated
    ]);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");

    doc.text("Inventory Report", 14, 15);

    doc.autoTable({
        startY: 20,
        head: [["Category", "Product", "Qty", "Min Qty", "Last Updated"]],
        body: rows,
        styles: { fontSize: 9 },
        headStyles: { fillColor: [10, 10, 10] }
    });

    doc.save("inventory.pdf");
}

/* Sidebar "Add product" / "Add party" links land here with a hash */
function focusFromHash() {
    const target = { addProduct: "name", addParty: "partyName" }[location.hash.replace("#", "")];
    if (!target) return;
    const el = document.getElementById(target);
    el.closest(".card").scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => el.focus(), 150);
}
window.addEventListener("hashchange", focusFromHash);

// Initialize database and load categories / dashboard
window.addEventListener('DOMContentLoaded', async () => {
    try {
        await DB.init();
        products = await DB.getAll("products");
        parties = await DB.getAll("parties");
        const belts = (await DB.getAll("timingBelts")) || [];
        document.getElementById("beltCount").innerText = belts.length;
        await loadCategories();
        updateDashboard();
        focusFromHash();
    } catch (e) {
        console.error("Failed to initialize database:", e);
    }
});
</script>

</body>
</html>
