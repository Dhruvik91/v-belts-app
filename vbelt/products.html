<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="db.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background: #0f172a;
            color: white;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar button {
            width: 100%;
            background: #1e293b;
            color: white;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .sidebar button:hover {
            background: #334155;
        }

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, .05);
        }

        .category h4 {
            background: #e0e7ff;
            padding: 10px;
            border-radius: 6px;
        }

        .product {
            background: white;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .low {
            background: #fee2e2;
        }

        .time {
            font-size: 12px;
            color: #475569;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #dc2626;
            font-size: 18px;
            cursor: pointer;
        }

        .bulk-header input {
            width: 300px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #e5e7eb;
            padding: 8px;
        }

        th {
            background: #f1f5f9;
        }

        td input {
            width: 100%;
            border: none;
            outline: none;
            padding: 6px;
        }

        button.add {
            background: #22c55e;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        button.sub {
            background: #ef4444;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
        }

        .modal-content {
            background: white;
            width: 650px;
            margin: 8% auto;
            padding: 20px;
            border-radius: 10px;
        }

        .close {
            float: right;
            cursor: pointer;
            font-weight: bold;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            padding: 6px 0;
        }

        /* Search box */
        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 300px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        /* ===== BULK ADD / SUBTRACT PROFESSIONAL UI ===== */

        .bulk-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .bulk-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .bulk-header {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .bulk-header label {
            font-size: 14px;
            font-weight: 500;
        }

        .bulk-header input {
            width: 200px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }

        .bulk-header input[readonly] {
            background: #f1f5f9;
        }

        .bulk-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        .bulk-table th {
            background: #1e293b;
            color: white;
            padding: 12px;
            font-size: 14px;
        }

        .bulk-table td {
            padding: 10px;
            padding-right: 25px;
            border: 1px solid #e5e7eb;
        }

        .bulk-table input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .bulk-submit {
            margin-top: 20px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .bulk-submit:hover {
            opacity: .95;
        }

        .bulk-note {
            font-size: 13px;
            color: #64748b;
            margin-top: 8px;
        }

        /* BULK BUTTON COLORS */

        .bulk-add-btn {
            background: linear-gradient(135deg, #16a34a, #15803d) !important;
        }

        .bulk-add-btn:hover {
            opacity: .9;
        }

        .bulk-sub-btn {
            background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
        }

        .bulk-sub-btn:hover {
            opacity: .9;
        }

        .product-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
        }

        .product-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
        }

        .product-actions button {
            padding: 5px 7px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid #999;
            background: #fff;
            cursor: pointer;
        }

        .product-actions button:hover {
            background: #f1f5f9;
        }

        .edit-btn {
            color: #16a34a;
        }

        .delete-btn {
            color: #dc2626;
        }

        .modal-content label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            display: block;
            margin-top: 8px;
            margin-bottom: 3px;
        }

        .modal {
            display: none;
            /* IMPORTANT */
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 999;
        }

        .history-box {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px dashed #ddd;
            font-size: 13px;
        }

        .history-row:last-child {
            border-bottom: none;
        }


        /* ===== CATEGORY BOX IMPROVEMENT ===== */
        .category-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            border-left: 6px solid #2563eb;
        }

        .category-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #eff6ff;
            color: #1e3a8a;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ===== CATEGORY SCROLL AREA ===== */
        .category-items {
            max-height: 420px;
            /* ~10 items */
            overflow-y: auto;
            padding-right: 6px;
        }

        /* Scrollbar */
        .category-items::-webkit-scrollbar {
            width: 6px;
        }

        .category-items::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }

        /* ===== PRODUCT ITEM ===== */
        .product-item {
            margin-bottom: 8px;
        }

        /* ===== PRODUCT ROW ===== */
        .product-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 12px;
            border-left: 4px solid transparent;
        }

        /* ===== LOW STOCK HIGHLIGHT ===== */
        .product-row.low-stock {
            background: #fff1f2;
            border-left: 4px solid #dc2626;
        }

        .low-stock-badge {
            background: #dc2626;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 6px;
        }

        /* ===== ACTION BUTTONS ===== */
        .product-actions {
            display: flex;
            gap: 6px;
        }

        .edit-btn {
            color: #16a34a;
        }

        .delete-btn {
            color: #dc2626;
        }

        .product-actions button {
            padding: 5px 7px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            cursor: pointer;
        }

        .product-actions button:hover {
            background: #f1f5f9;
        }

        .product-row.active-product {
            background: #dbeafe !important;
            border: 2px solid #2563eb;
        }

        .view-btn {
            color: #2563eb;
        }

        /* ===== SEARCHABLE DROPDOWN (products & parties) ===== */
        .combo-dropdown {
            display: none;
            position: fixed;
            z-index: 1100;
            max-height: 260px;
            overflow-y: auto;
            padding: 4px;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
        }

        .combo-dropdown.open {
            display: block;
        }

        .combo-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #0f172a;
            cursor: pointer;
        }

        .combo-option:hover {
            background: #f1f5f9;
        }

        .combo-option.highlighted {
            background: #dbeafe;
        }

        .combo-option-meta {
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }

        .combo-empty {
            padding: 10px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }

        /* ===== PRODUCT DETAILS MODAL ===== */
        .modal-content.modal-wide {
            max-width: 760px;
        }

        .details-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .details-stat {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .details-stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }

        .details-stat-value {
            margin-top: 4px;
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }

        .details-table-wrap {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            font-size: 13px;
        }

        .details-table th {
            position: sticky;
            top: 0;
            background: #1e293b;
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: 600;
        }

        .details-table td {
            padding: 9px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }

        .details-table .num {
            text-align: right;
        }

        .qty-in,
        .details-table .qty-in {
            color: #16a34a;
            font-weight: 700;
        }

        .qty-out,
        .details-table .qty-out {
            color: #dc2626;
            font-weight: 700;
        }

        .type-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .type-pill.add {
            background: #dcfce7;
            color: #15803d;
        }

        .type-pill.sub {
            background: #fee2e2;
            color: #b91c1c;
        }

        .type-pill.edit {
            background: #e0e7ff;
            color: #1e3a8a;
        }

        .details-empty {
            text-align: center;
            color: #94a3b8;
            padding: 18px 0;
        }

        /* Modern Modal System */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.15s ease;
        }

        .modal.open {
            display: flex !important;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            position: relative;
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            line-height: 1;
            transition: all 0.15s ease;
        }

        .modal-close-btn:hover {
            color: #0f172a;
            background: #f1f5f9;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }

        .modal-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .modal-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }

        .modal-btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
        }

        .modal-btn-cancel {
            background: #f1f5f9;
            color: #334155;
        }

        .modal-btn-cancel:hover {
            background: #e2e8f0;
        }

        .modal-btn-save {
            background: #2563eb;
            color: white;
        }

        .modal-btn-save:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Inventory</h2>
        <button onclick="location.href='index.html'">Dashboard</button>
        <button onclick="showSection('inventory')">Inventory</button>
        <button onclick="showSection('bulkSub')">Bulk Subtract</button>
        <button onclick="showSection('bulkAdd')">Bulk Add</button>
        <button onclick="location.href='party.html'">Party List</button>
        <button onclick="location.href='low-stock.html'">Low Stock Items</button>
        <button onclick="location.href='timing-belt.html'">Timing Belt</button>


    </div>

    <div class="main">

        <!-- INVENTORY -->
        <div class="card" id="inventorySection">
            <h3>Products</h3>

            <div class="search-box">
                🔎 Search Product:
                <input type="text" id="searchProduct" placeholder="Search product...">

            </div>

            <div id="productList"></div>
        </div>




        <!-- BULK ADD -->
        <div class="bulk-card" id="bulkAddSection" style="display:none;">

            <div class="bulk-title">Bulk Add Stock</div>

            <div class="bulk-header">
                <div>
                    <label>Party Code</label>
                    <input id="addPartyCode" oninput="autoFillParty('add')" placeholder="Search code or name" autocomplete="off">
                </div>

                <div>
                    <label>Party Name</label>
                    <input id="addPartyName" readonly>
                </div>
            </div>

            <table class="bulk-table" id="addTable">
                <thead>
                    <tr>
                        <th style="width:70%">Product Name</th>
                        <th style="width:30%">Quantity</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button class="bulk-submit bulk-add-btn" onclick="submitBulk('add')">
                Save Bulk Add
            </button>

            <div class="bulk-note">
                TAB in Quantity box → new row automatically added
            </div>

        </div>



        <!-- BULK SUBTRACT -->
        <div class="bulk-card" id="bulkSubSection" style="display:none;">

            <div class="bulk-title">Bulk Subtract Stock</div>

            <div class="bulk-header">
                <div>
                    <label>Party Code</label>
                    <input id="subPartyCode" oninput="autoFillParty('sub')" placeholder="Search code or name" autocomplete="off">
                </div>

                <div>
                    <label>Party Name</label>
                    <input id="subPartyName" readonly>
                </div>
            </div>

            <table class="bulk-table" id="subTable">
                <thead>
                    <tr>
                        <th style="width:70%">Product Name</th>
                        <th style="width:30%">Quantity</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button class="bulk-submit bulk-sub-btn" onclick="submitBulk('sub')">
                Save Bulk Subtract
            </button>

            <div class="bulk-note">
                TAB in Quantity box → new row automatically added
            </div>

        </div>




    </div>

    <!-- PRODUCT DETAILS MODAL -->
    <div class="modal" id="productDetailsModal">
        <div class="modal-content modal-wide">
            <div class="modal-header">
                <h3 id="productDetailsTitle">📋 Product Details</h3>
                <button class="modal-close-btn" onclick="closeProductDetails()">&times;</button>
            </div>

            <div class="modal-body">
                <div class="details-summary" id="productDetailsSummary"></div>

                <div class="modal-group">
                    <label>Stock Movements (last 30 days)</label>
                    <div class="details-table-wrap">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th>Date &amp; Time</th>
                                    <th>Party</th>
                                    <th>Type</th>
                                    <th class="num">Qty</th>
                                    <th class="num">Stock After</th>
                                </tr>
                            </thead>
                            <tbody id="productDetailsHistory"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" onclick="closeProductDetails()">Close</button>
            </div>
        </div>
    </div>

    <!-- EDIT PRODUCT MODAL -->
    <div class="modal" id="editProductModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Edit Product</h3>
                <button class="modal-close-btn" onclick="closeEditProduct()">&times;</button>
            </div>

            <div class="modal-body">
                <div class="modal-group">
                    <label for="editProdName">Product Name</label>
                    <input id="editProdName" placeholder="Enter product name">
                </div>

                <div class="modal-group">
                    <label for="editProdQty">Quantity</label>
                    <input id="editProdQty" type="number" placeholder="Enter stock quantity">
                </div>

                <div class="modal-group">
                    <label for="editProdMin">Minimum Quantity Alert</label>
                    <input id="editProdMin" type="number" placeholder="Enter minimum quantity threshold">
                </div>
            </div>

            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" onclick="closeEditProduct()">Cancel</button>
                <button class="modal-btn modal-btn-save" onclick="saveProductEdit()">Save Changes</button>
            </div>
        </div>
    </div>



    <script>
        let products = [];
        let parties = [];



        function showSection(sec) {
            inventorySection.style.display = "none";
            bulkAddSection.style.display = "none";
            bulkSubSection.style.display = "none";
            if (typeof partySection !== "undefined") {
                partySection.style.display = "none";
            }

            if (sec === "inventory") {
                inventorySection.style.display = "block";
            }

            if (sec === "bulkAdd") {
                bulkAddSection.style.display = "block";
                setTimeout(() => addPartyCode.focus(), 100);
            }

            if (sec === "bulkSub") {
                bulkSubSection.style.display = "block";
                setTimeout(() => subPartyCode.focus(), 100);
            }


            if (sec === "party") {
                if (typeof partySection !== "undefined") {
                    partySection.style.display = "block";
                }
            }
        }

        /* INVENTORY + SEARCH */
        function renderProducts(searchText = document.getElementById("searchProduct").value) {

            const list = document.getElementById("productList");
            list.innerHTML = "";

            const search = searchText.toLowerCase();

            const filteredProducts = products.filter(p =>
                p.name.toLowerCase().includes(search)
            );

            if (filteredProducts.length === 0) {
                list.innerHTML = `
            <div style="padding:20px;text-align:center;color:#64748b">
                No products found
            </div>`;
                return;
            }

            const grouped = {};
            filteredProducts.forEach(p => {
                if (!grouped[p.category]) grouped[p.category] = [];
                grouped[p.category].push(p);
            });

            Object.keys(grouped)
                .sort((a, b) => a.localeCompare(b))

        let activeProductId = null;

        function setActiveProduct(id, element) {

        /* DELETE PRODUCT */
        async function deleteProduct(id) {
            const product = products.find(p => p.id === id);
            const name = product ? product.name : "this product";

            const confirmed = await showConfirm(`Are you sure you want to permanently delete "${name}" from inventory?`, {
                title: "Delete Product",
                confirmText: "Delete",
                isDanger: true
            });

            if (!confirmed) return;

            // Remove product from array
            products = products.filter(p => p.id !== id);

            // Save updated array
            await DB.saveAll("products", products);

            // Re-render UI
            renderProducts();

            showToast(`"${name}" deleted successfully`, "info");
        }


        /*DELETE OLDER DATA*/
        async function cleanupOldHistory() {
            const THIRTY_DAYS = 1000 * 60 * 60 * 24 * 30;
            const now = Date.now();

            products.forEach(p => {
                if (!p.history) return;

                // Older entries only have a locale-formatted `date` (e.g. "26/10/2026, 10:47:09")
                // which new Date() can't parse, so keep those rather than dropping them
                p.history = p.history.filter(h => {
                    const time = new Date(h.at || h.date).getTime();
                    return isNaN(time) || (now - time) <= THIRTY_DAYS;
                });
            });

            await DB.saveAll("products", products);
        }

        // 🔍 SEARCH LISTENER (DEBOUNCED)
        function debounce(fn, delay = 300) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        document.getElementById("searchProduct").addEventListener("input", debounce(function () {
            renderProducts(this.value.trim());

        /* EDIT PRODUCT*/
        async function saveProductEdit() {
            const name = editProdName.value.trim();
            const qty = parseInt(editProdQty.value);
            const min = parseInt(editProdMin.value);

            if (!name || isNaN(qty) || isNaN(min) || qty < 0 || min < 0) {
                showToast("Please enter a valid product name and non-negative quantities", "error");
                return;
            }

            const product = products.find(p => p.id === editProductId);
            if (!product) return;

            const now = new Date();
            const qtyChange = qty - product.qty;

            product.name = name;
            product.qty = qty;
            product.minQty = min;
            product.lastUpdated = now.toLocaleString();

            if (qtyChange !== 0) {
                if (!product.history) product.history = [];
                product.history.unshift({
                    customer: "Manual Adjustment",
                    type: "edit",
                    qty: qtyChange,
                    balance: qty,
                    date: product.lastUpdated,
                    at: now.toISOString()
                });
            }

            // Low stock tracking
            if (qty <= min && !product.lowStockDate) {
                product.lowStockDate = new Date().toISOString();
            }
            if (qty > min) {
                delete product.lowStockDate;
            }

            await DB.saveAll("products", products);

            // Close modal
            closeEditProduct();

            // Re-render
            renderProducts();

            showToast(`Product "${name}" updated successfully`, "success");

            // 🔥 Scroll to edited product
            setTimeout(() => {
                const element = document.getElementById(`product-${editProductId}`);
                if (element) {
                    element.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });
                }
            }, 100);
        }



        /* SEARCHABLE DROPDOWN */
        // One floating list shared by every dropdown. It is position: fixed and lives on <body>
        // so the bulk table's overflow: hidden doesn't clip it.
        const comboDropdown = document.createElement("div");
        comboDropdown.className = "combo-dropdown";
        document.body.appendChild(comboDropdown);

        // Keep focus in the input when the list (or its scrollbar) is clicked
        comboDropdown.addEventListener("mousedown", e => e.preventDefault());

        let activeCombo = null;

        // getOptions(query) -> [{ label, meta, value }]; onSelect(option, advance) where
        // advance is false on Tab, because the browser is already moving focus to the next field
        function attachCombobox(input, { getOptions, onSelect, emptyText }) {
            const combo = { input, getOptions, onSelect, emptyText, options: [], highlighted: -1 };

            input.setAttribute("autocomplete", "off");
            input.addEventListener("focus", () => openCombo(combo));
            input.addEventListener("click", () => openCombo(combo));
            input.addEventListener("input", () => openCombo(combo));
            input.addEventListener("blur", () => {
                if (activeCombo === combo) closeCombo();
            });

            input.addEventListener("keydown", e => {
                if (activeCombo !== combo) {
                    if (e.key === "ArrowDown") {
                        e.preventDefault();
                        openCombo(combo);
                    }
                    return;
                }

                const count = combo.options.length;

                if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                    e.preventDefault();
                    if (!count) return;
                    const step = e.key === "ArrowDown" ? 1 : -1;
                    combo.highlighted = (combo.highlighted + step + count) % count;
                    renderCombo(combo);
                } else if (e.key === "Enter") {
                    if (combo.highlighted >= 0) {
                        e.preventDefault();
                        selectComboOption(combo, combo.highlighted, true);
                    }
                } else if (e.key === "Tab") {
                    if (combo.highlighted >= 0 && input.value.trim()) {
                        selectComboOption(combo, combo.highlighted, false);
                    }
                    closeCombo();
                } else if (e.key === "Escape") {
                    closeCombo();
                }
            });
        }

        function openCombo(combo) {
            const query = combo.input.value.trim().toLowerCase();
            activeCombo = combo;
            combo.options = combo.getOptions(query);
            combo.highlighted = query && combo.options.length ? 0 : -1;
            renderCombo(combo);
        }

        function renderCombo(combo) {
            comboDropdown.innerHTML = "";

            if (!combo.options.length) {
                const empty = document.createElement("div");
                empty.className = "combo-empty";
                empty.textContent = combo.emptyText;
                comboDropdown.appendChild(empty);
            }

            combo.options.forEach((opt, i) => {
                const row = document.createElement("div");
                row.className = "combo-option" + (i === combo.highlighted ? " highlighted" : "");

                const label = document.createElement("span");
                label.textContent = opt.label;
                const meta = document.createElement("span");
                meta.className = "combo-option-meta";
                meta.textContent = opt.meta || "";
                row.append(label, meta);

                // mousedown instead of click so the input doesn't blur (and close the list) first
                row.addEventListener("mousedown", e => {
                    e.preventDefault();
                    selectComboOption(combo, i, true);
                });

                comboDropdown.appendChild(row);
            });

            positionCombo(combo);
            comboDropdown.classList.add("open");

            const highlightedRow = comboDropdown.children[combo.highlighted];
            if (highlightedRow) highlightedRow.scrollIntoView({ block: "nearest" });
        }

        function positionCombo(combo) {
            const rect = combo.input.getBoundingClientRect();
            const listHeight = 264;
            const opensUp = rect.bottom + listHeight > window.innerHeight && rect.top > listHeight;

            comboDropdown.style.left = rect.left + "px";
            comboDropdown.style.width = Math.max(rect.width, 280) + "px";
            comboDropdown.style.top = opensUp ? "" : (rect.bottom + 4) + "px";
            comboDropdown.style.bottom = opensUp ? (window.innerHeight - rect.top + 4) + "px" : "";
        }

        function closeCombo() {
            activeCombo = null;
            comboDropdown.classList.remove("open");
        }

        function selectComboOption(combo, index, advance) {
            const opt = combo.options[index];
            if (!opt) return;
            closeCombo();
            combo.onSelect(opt, advance);
        }

        window.addEventListener("resize", () => activeCombo && positionCombo(activeCombo));
        document.addEventListener("scroll", () => activeCombo && positionCombo(activeCombo), true);

        // Exact matches first, then "starts with", then "contains"
        function rankMatches(items, query, fieldsOf) {
            if (!query) return items;

            return items
                .map(item => {
                    const values = fieldsOf(item).map(v => String(v || "").toLowerCase());
                    const rank = values.some(v => v === query) ? 0
                        : values.some(v => v.startsWith(query)) ? 1
                        : values.some(v => v.includes(query)) ? 2
                        : -1;
                    return { item, rank };
                })
                .filter(x => x.rank >= 0)
                .sort((a, b) => a.rank - b.rank)
                .map(x => x.item);
        }

        function productOptions(query) {
            const sorted = [...products].sort((a, b) => a.name.localeCompare(b.name));
            return rankMatches(sorted, query, p => [p.name, p.category]).map(p => ({
                label: p.name,
                meta: `${p.category} · Qty ${p.qty}`,
                value: p
            }));
        }

        function partyOptions(query) {
            const sorted = [...parties].sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
            return rankMatches(sorted, query, p => [p.code, p.name]).map(p => ({
                label: `${p.code} — ${p.name}`,
                meta: p.notes || "",
                value: p
            }));
        }

        function attachPartyCombobox(mode) {
            const codeInput = document.getElementById(`${mode}PartyCode`);
            const nameInput = document.getElementById(`${mode}PartyName`);
            const tableId = mode === "add" ? "addTable" : "subTable";

            attachCombobox(codeInput, {
                getOptions: partyOptions,
                emptyText: "No parties found",
                onSelect: (opt, advance) => {
                    codeInput.value = opt.value.code;
                    nameInput.value = opt.value.name;
                    if (advance) document.querySelector(`#${tableId} tbody .prod-input`)?.focus();
                }
            });
        }


        function isValidProduct(name) {
            return products.some(p =>
                p.name.trim().toLowerCase() === name.trim().toLowerCase()
            );
        }


        /* BULK PROCESS */
        async function submitBulk(mode) {

            // 🔥 IMPORTANT FIX
            products = await DB.getAll("products");
            
            const partyName = mode === "add"
                ? document.getElementById("addPartyName").value.trim()
                : document.getElementById("subPartyName").value.trim();

            const partyCode = mode === "add"
                ? document.getElementById("addPartyCode").value.trim()
                : document.getElementById("subPartyCode").value.trim();

            if (!partyName) {
                showToast("Please enter a valid Party Code / Name", "error");
                return;
            }

            const table = mode === "add"
                ? document.getElementById("addTable")
                : document.getElementById("subTable");

            const rows = [...table.querySelectorAll("tbody tr")];

            let validEntry = false;

            for (let r of rows) {

                const productInput = r.querySelector(".prod-input");
                const qtyInput = r.querySelector(".qty-input");

                const name = productInput.value.trim();
                const qty = parseInt(qtyInput.value);

                if (!name && !qty) continue;

                if (!isValidProduct(name)) {
                    showToast(`Invalid product: "${name}". Please select from the dropdown.`, "error");
                    productInput.focus();
                    return;
                }

                if (isNaN(qty) || qty <= 0) {
                    showToast(`Please enter a valid quantity for "${name}"`, "error");
                    qtyInput.focus();
                    return;
                }

                const product = products.find(p =>
                    p.name.trim().toLowerCase() === name.trim().toLowerCase()
                );

                if (!product) {
                    showToast("Product not found: " + name, "error");
                    return;
                }

                if (mode === "sub" && product.qty < qty) {
                    showToast(`Not enough stock for "${name}" (Current stock: ${product.qty})`, "error");
                    qtyInput.focus();
                    return;
                }

                if (mode === "add") product.qty += qty;
                else product.qty -= qty;

                const now = new Date();
                product.lastUpdated = now.toLocaleString();

                if (!product.history) product.history = [];
                product.history.unshift({
                    customer: partyName,
                    partyCode,
                    type: mode,
                    qty: mode === "add" ? qty : -qty,
                    balance: product.qty,
                    date: product.lastUpdated,
                    at: now.toISOString()
                });

                // LOW STOCK TRACKING (FIXED)
                if (product.qty <= product.minQty && !product.lowStockDate) {
                    product.lowStockDate = new Date().toISOString();
                }

                if (product.qty > product.minQty) {
                    delete product.lowStockDate;
                }


                validEntry = true;
            }

            if (!validEntry) {
                showToast("Please enter at least one valid product and quantity", "warning");
                return;
            }

            await DB.saveAll("products", products);

            showToast("Bulk operation completed successfully!", "success");

            table.querySelector("tbody").innerHTML = "";
            addRow(table.id);

            if (mode === "add") {
                addPartyCode.value = "";
                addPartyName.value = "";
                addPartyCode.focus();
            } else {
                subPartyCode.value = "";
                subPartyName.value = "";
                subPartyCode.focus();
            }

            renderProducts();

            /*// LOW STOCK TRACKING
            if (p.qty <= p.minQty && !p.lowStockDate) {
                p.lowStockDate = new Date().toISOString();
            }
        
            if (p.qty > p.minQty) {
                delete p.lowStockDate;
            }*/

        }


        /*F2 AND F3*/

            if (!activeProductId) return;

            if (e.key === "F2") {

        /* AUTOFILL PROCESS */
        function autoFillParty(type) {

            let codeInput, nameInput;

            if (type === "add") {
                codeInput = document.getElementById("addPartyCode");
                nameInput = document.getElementById("addPartyName");
            } else {
                codeInput = document.getElementById("subPartyCode");
                nameInput = document.getElementById("subPartyName");
            }

            const code = codeInput.value.trim(); // NO CASE CONVERSION

            const party = parties.find(p => p.code === code);

            if (party) {
                nameInput.value = party.name;
            } else {
                nameInput.value = "";
            }
        }


        /* PRODUCT DETAILS */
        function openProductDetails(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const history = product.history || [];
            const isLow = product.qty <= product.minQty;

            // Manual edits are excluded so the totals reflect party movements only
            const partyMoves = history.filter(h => h.type !== "edit");
            const totalAdded = partyMoves.filter(h => h.qty > 0).reduce((sum, h) => sum + h.qty, 0);
            const totalSubtracted = partyMoves.filter(h => h.qty < 0).reduce((sum, h) => sum - h.qty, 0);

            document.getElementById("productDetailsTitle").innerHTML =
                `📋 ${product.name}${isLow ? '<span class="low-stock-badge">LOW STOCK</span>' : ''}`;

            const stats = [
                ["Category", product.category],
                ["Current Stock", product.qty],
                ["Minimum Qty", product.minQty],
                ["Total Added", `<span class="qty-in">+${totalAdded}</span>`],
                ["Total Subtracted", `<span class="qty-out">-${totalSubtracted}</span>`],
                ["Last Updated", product.lastUpdated || "-"]
            ];

            document.getElementById("productDetailsSummary").innerHTML = stats.map(([label, value]) => `
                <div class="details-stat">
                    <div class="details-stat-label">${label}</div>
                    <div class="details-stat-value">${value}</div>
                </div>
            `).join("");

            const tbody = document.getElementById("productDetailsHistory");

            if (!history.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="details-empty">No stock movements recorded yet</td></tr>`;
            } else {
                // history is stored newest first
                tbody.innerHTML = history.map(h => {
                    const type = h.type || (h.qty > 0 ? "add" : "sub");
                    const typeLabel = { add: "Added", sub: "Subtracted", edit: "Adjusted" }[type];
                    const when = h.at ? new Date(h.at).toLocaleString() : h.date;
                    const party = h.partyCode ? `${h.customer} (${h.partyCode})` : (h.customer || "-");

                    return `
                        <tr>
                            <td>${when}</td>
                            <td>${party}</td>
                            <td><span class="type-pill ${type}">${typeLabel}</span></td>
                            <td class="num ${h.qty > 0 ? 'qty-in' : 'qty-out'}">${h.qty > 0 ? '+' + h.qty : h.qty}</td>
                            <td class="num">${h.balance ?? '-'}</td>
                        </tr>
                    `;
                }).join("");
            }

            const modal = document.getElementById("productDetailsModal");
            modal.classList.add("open");
            modal.style.display = "flex";
        }

        function closeProductDetails() {
            const modal = document.getElementById("productDetailsModal");
            modal.classList.remove("open");
            modal.style.display = "none";
        }

        // Close modals on backdrop click or Escape key
        window.addEventListener("click", function (e) {
            const editModal = document.getElementById("editProductModal");
            const detailsModal = document.getElementById("productDetailsModal");
            if (e.target === editModal) closeEditProduct();
            if (e.target === detailsModal) closeProductDetails();
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeEditProduct();
                closeProductDetails();
            }
        });

        /* INIT */
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await DB.init();
                products = await DB.getAll("products");
                parties = await DB.getAll("parties");
                attachPartyCombobox("add");
                attachPartyCombobox("sub");
                addRow("addTable");
                addRow("subTable");
                showSection(sectionFromHash());
                await cleanupOldHistory();
                renderProducts();
            } catch (e) {
                console.error("Failed to initialize database:", e);
            }
        });





        /* ===== GLOBAL ERP SHORTCUTS (FINAL FIX — ALL DIRECTIONS WORK) ===== */

        document.addEventListener("keydown", function (e) {

            if (!e.ctrlKey) return;

            const key = e.key.toLowerCase();
            e.preventDefault();
            e.stopPropagation();

            const onProductsPage = window.location.pathname.endsWith("products.html");

            switch (key) {

                case "d":
                    // Always go to Dashboard
                    window.location.href = "index.html";
                    break;

                case "i":
                    // Inventory
                    if (onProductsPage) {
                        showSection("inventory");
                    } else {
                        window.location.href = "products.html";
                    }
                    break;

                case "a":
                    // Bulk Add
                    if (onProductsPage) {
                        showSection("bulkAdd");
                    } else {
                        window.location.href = "products.html#bulkAdd";
                    }
                    break;

                case "s":
                    // Bulk Subtract
                    if (onProductsPage) {
                        showSection("bulkSub");
                    } else {
                        window.location.href = "products.html#bulkSub";
                    }
                    break;
            }

        }, true);

        /* AUTO OPEN SECTION IF HASH EXISTS */
        function sectionFromHash() {
            const hash = window.location.hash.replace("#", "");
            return hash === "bulkAdd" || hash === "bulkSub" ? hash : "inventory";
        }

        if (window.location.pathname.endsWith("products.html")) {
            showSection(sectionFromHash());
        }


    </script>
