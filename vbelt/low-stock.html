<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Stock Items</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="db.js"></script>
</head>

<body data-page="lowStock" data-title="Low stock">

    <aside class="sidebar" id="sidebar"></aside>
    <script src="shell.js"></script>

    <main class="main">
    <div class="page">

        <div class="page-header">
            <div>
                <h1>Low stock</h1>
                <p>Products at or below their minimum quantity.</p>
            </div>
            <div class="page-actions">
                <a class="btn btn-primary" href="purchase-order.html"><script>document.write(icon('file'))</script>Generate purchase order</a>
            </div>
        </div>

        <section class="card">
            <div class="card-header">
                <label class="search">
                    <script>document.write(icon('search'))</script>
                    <input type="text" id="searchLowStock" placeholder="Search by product or category">
                </label>
                <span class="badge badge-danger badge-mono" id="lowCountBadge">0 items</span>
            </div>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th class="num">Qty</th>
                            <th class="num">Min qty</th>
                            <th class="num">Low since</th>
                            <th class="num">Days</th>
                        </tr>
                    </thead>
                    <tbody id="lowStockList"></tbody>
                </table>
            </div>
        </section>

    </div>
    </main>

    <script>
        let products = [];

        function daysBetween(dateStr) {
            const d1 = new Date(dateStr);
            const d2 = new Date();
            return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        }

        async function renderLowStock() {

            const tbody = document.getElementById("lowStockList");
            tbody.innerHTML = "";

            const lowItems = products.filter(p => p.qty <= p.minQty);

            if (!lowItems.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty">Everything is above its minimum quantity.</td></tr>`;
                document.getElementById("lowCountBadge").textContent = "0 items";
                return;
            }

            let updated = false;
            lowItems.forEach(p => {
                if (!p.lowStockDate) {
                    p.lowStockDate = new Date().toISOString();
                    updated = true;
                }
            });

            document.getElementById("lowCountBadge").textContent = `${lowItems.length} item${lowItems.length === 1 ? '' : 's'}`;

            const q = document.getElementById("searchLowStock").value.trim().toLowerCase();
            const visibleItems = lowItems.filter(p =>
                p.name.toLowerCase().includes(q) ||
                (p.category || "").toLowerCase().includes(q)
            );

            if (!visibleItems.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty">No matching items found</td></tr>`;
            }

            visibleItems.forEach(p => {

                const days = daysBetween(p.lowStockDate);

                const tr = document.createElement("tr");
                tr.innerHTML = `
            <td><b>${p.name}</b></td>
            <td class="muted">${p.category}</td>
            <td class="num"><span class="qty-out">${p.qty}</span></td>
            <td class="num">${p.minQty}</td>
            <td class="num muted">${new Date(p.lowStockDate).toLocaleDateString()}</td>
            <td class="num"><span class="badge badge-mono ${days >= 7 ? 'badge-danger' : 'badge-warning'}">${days}d</span></td>
        `;

                tbody.appendChild(tr);
            });

            if (updated) {
                await DB.saveAll("products", products);
            }
        }

        function debounce(fn, delay = 300) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        document.getElementById("searchLowStock").addEventListener("input", debounce(renderLowStock));

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await DB.init();
                products = await DB.getAll("products");
                await renderLowStock();
            } catch (e) {
                console.error("Failed to initialize database:", e);
            }
        });
    </script>

</body>

</html>
